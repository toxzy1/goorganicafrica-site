  - name: "ag_data_pending"
    label: "🔎 Agricultural Data Review Queue"
    folder: "data/ag-data/pending"
    create: false
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - {label: "Review Batch", name: "title", widget: "string"}
      - {label: "Generated At", name: "generated_at", widget: "datetime"}
      - {label: "Candidate Count", name: "candidate_count", widget: "number", value_type: "int"}
      - label: "Candidates"
        name: "candidates"
        widget: "list"
        required: false
        fields:
          - {label: "Enterprise ID", name: "commodity_id", widget: "string"}
          - {label: "Country", name: "country", widget: "string"}
          - {label: "Region", name: "region", widget: "string", required: false}
          - {label: "Data Type", name: "data_type", widget: "string"}
          - {label: "Source Type", name: "source_type", widget: "string"}
          - {label: "Publisher", name: "publisher", widget: "string", required: false}
          - {label: "Source", name: "source", widget: "string", required: false}
          - {label: "Source URL", name: "source_url", widget: "string", required: false}
          - {label: "Download URL", name: "download_url", widget: "string", required: false}
          - {label: "Variety", name: "variety", widget: "string", required: false}
          - {label: "Brand", name: "brand", widget: "string", required: false}
          - {label: "Pack Size", name: "pack_size", widget: "string", required: false}
          - {label: "Price", name: "price", widget: "number", value_type: "float", required: false}
          - {label: "Unit", name: "unit", widget: "string", required: false}
          - {label: "As Of", name: "as_of", widget: "string", required: false}
          - {label: "Retrieved At", name: "retrieved_at", widget: "datetime", required: false}
          - {label: "Review Status", name: "status", widget: "select", options: ["needs_review", "approved", "rejected"], default: "needs_review"}
          - {label: "Reason / Validation Note", name: "reason", widget: "text", required: false}
          - {label: "Reviewer Notes", name: "review_notes", widget: "text", required: false}
          - label: "Matched Source Row"
            name: "matched_row"
            widget: "list"
            required: false
          - label: "Numeric Source Cells"
            name: "numeric_cells"
            widget: "list"
            required: false
            fields:
              - {label: "Column Index", name: "column_index", widget: "number", value_type: "int"}
              - {label: "Value", name: "value", widget: "number", value_type: "float"}
      - label: "Source Errors"
        name: "errors"
        widget: "list"
        required: false
        fields:
          - {label: "Source", name: "source", widget: "string"}
          - {label: "Error", name: "error", widget: "text"}

