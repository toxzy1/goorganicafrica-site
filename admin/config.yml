backend:
  name: github
  repo: toxzy1/goorganicafrica-site
  branch: main
  use_graphql: true
  base_url: https://goorganicafrica-cms-auth.goorganicafricans.workers.dev
  auth_endpoint: /auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"
site_url: https://goorganicafrica-site.pages.dev
display_url: https://goorganicafrica-site.pages.dev
logo_url: /images/brand-mark.svg
publish_mode: editorial_workflow

collections:
  - name: "site_settings"
    label: "⚙️ Site Settings, SEO & AdSense"
    files:
      - label: "Global Website Settings"
        name: "settings"
        file: "src/_data/siteSettings.json"
        editor: {preview: false}
        fields:
          - {label: "Site Name", name: "site_name", widget: "string"}
          - {label: "Canonical Site URL", name: "site_url", widget: "string", hint: "Use your live Cloudflare Pages URL or your final custom domain."}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "SEO Meta Title", name: "meta_title", widget: "string", required: false}
          - {label: "SEO Meta Description", name: "meta_description", widget: "text", required: false}
          - {label: "Default Site Description", name: "description", widget: "text"}
          - {label: "Author", name: "author", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string"}
          - {label: "WhatsApp Link", name: "whatsapp", widget: "string"}
          - label: "Google AdSense"
            name: "adsense"
            widget: "object"
            fields:
              - {label: "Enable AdSense Code", name: "enabled", widget: "boolean", default: false, hint: "Leave OFF until the site is approved by Google AdSense."}
              - {label: "Publisher ID", name: "publisher_id", widget: "string", required: false, hint: "Example format: ca-pub-xxxxxxxxxxxxxxxx"}
              - {label: "Auto Ads", name: "auto_ads", widget: "boolean", default: false}
              - {label: "Notes", name: "notes", widget: "text", required: false}
          - label: "Google Analytics"
            name: "analytics"
            widget: "object"
            fields:
              - {label: "Enabled", name: "enabled", widget: "boolean", default: false}
              - {label: "Measurement ID", name: "measurement_id", widget: "string", required: false, hint: "Example: G-XXXXXXXXXX. Add this only after Google Analytics is created."}
              - {label: "Notes", name: "notes", widget: "text", required: false}
          - label: "SEO Defaults"
            name: "seo"
            widget: "object"
            fields:
              - {label: "Default Meta Title", name: "default_meta_title", widget: "string"}
              - {label: "Default Meta Description", name: "default_meta_description", widget: "text"}
              - {label: "Default Keywords", name: "default_keywords", widget: "list"}

  - name: "categories"
    label: "🗂️ Global Agricultural Categories"
    files:
      - label: "Category Registry"
        name: "categories"
        file: "src/_data/categories.json"
        editor: {preview: false}
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "URL Slug", name: "slug", widget: "string"}
              - {label: "Parent Category", name: "parent", widget: "string", required: false}
              - {label: "Active?", name: "active", widget: "boolean", default: true}
              - {label: "Display Order", name: "order", widget: "number", value_type: "int"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "SEO Title", name: "seo_title", widget: "string", required: false}
              - {label: "SEO Description", name: "seo_description", widget: "text", required: false}

  - name: "ebooks"
    label: "📚 Ebooks & Selar Products"
    folder: "src/ebooks"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — ₦{{price}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/ebook.njk"}
      - {label: "Permalink", name: "permalink", widget: "hidden", default: "/ebooks/{{slug}}/"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string"}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Cover Image", name: "icon", widget: "image"}
      - {label: "Price (NGN)", name: "price", widget: "number", value_type: "int"}
      - {label: "Selar Checkout Link", name: "selar_link", widget: "string", hint: "Paste the current Selar checkout/product URL here. This is the single link used by the product page buttons."}
      - {label: "Featured?", name: "featured", widget: "boolean", default: false}
      - {label: "Active?", name: "active", widget: "boolean", default: true}
      - {label: "Content Language", name: "language", widget: "select", options: ["en", "fr", "ar", "pt", "sw"], default: "en"}
      - {label: "Translation Group", name: "translation_group", widget: "string", required: false, hint: "Use the same stable group ID for every language version of this eBook, e.g. ebook-bsf."}
      - {label: "Source Language", name: "source_language", widget: "select", options: ["en", "fr", "ar", "pt", "sw"], default: "en", hint: "The language of the original/source content for this translation group."}
      - {label: "Translation Status", name: "translation_status", widget: "select", options: ["source", "in_review", "published", "translated", "needs_update", "archived"], default: "source", hint: "Mark needs_update when the source article changes and this translation needs review."}
      - {label: "Display Order", name: "order", widget: "number", value_type: "int"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Audience", name: "audience", widget: "list"}
      - {label: "Search Terms / Synonyms", name: "search_terms", widget: "list", required: false, hint: "Alternative phrases visitors may type, e.g. pig farming, piggery, pig production."}
      - {label: "Benefits", name: "benefits", widget: "list"}
      - {label: "Bonus", name: "bonus", widget: "string", required: false}
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - {label: "Question", name: "q", widget: "string"}
          - {label: "Answer", name: "a", widget: "text"}
      - {label: "Meta Description", name: "meta_description", widget: "text"}
      - {label: "Page Body", name: "body", widget: "markdown", required: false}

  - name: "blog_categories"
    label: "🗂️ Blog Categories"
    folder: "src/blog-categories"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Display Order", name: "order", widget: "number", value_type: "int"}
      - {label: "Active?", name: "active", widget: "boolean", default: true}

  - name: "posts"
    label: "📝 Blog Posts"
    folder: "src/blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Active?", name: "active", widget: "boolean", default: true, hint: "Turn off to hide this article from listings and the sitemap without deleting it."}
      - {label: "Content Language", name: "language", widget: "select", options: ["en", "fr", "ar", "pt", "sw"], default: "en"}
      - {label: "Translation Group", name: "translation_group", widget: "string", required: false, hint: "Use the same stable group ID for every language version of this article, e.g. blog-bsf."}
      - {label: "Source Language", name: "source_language", widget: "select", options: ["en", "fr", "ar", "pt", "sw"], default: "en", hint: "The language of the original/source content for this translation group."}
      - {label: "Translation Status", name: "translation_status", widget: "select", options: ["source", "translated", "needs_update", "in_review"], default: "source", hint: "Mark needs_update when the source article changes and this translation needs review."}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Featured Image", name: "featured_image", widget: "image", required: true}
      - {label: "Meta Title", name: "meta_title", widget: "string", required: false}
      - {label: "Meta Description", name: "meta_description", widget: "text"}
      - {label: "SEO Keywords", name: "keywords", widget: "list", required: false}
      - {label: "Related eBook Slug", name: "related_ebook_slug", widget: "string", required: false, hint: "Optional: connect this article to an eBook so the article can automatically show its current price and Selar link."}
      - {label: "Show eBook CTA", name: "show_ebook_cta", widget: "boolean", default: true}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "calculator_countries"
    label: "🌍 Calculator: Countries"
    files:
      - label: "Country List"
        name: "countries"
        file: "src/_data/calculatorCountries.json"
        editor: {preview: false}
        fields:
          - label: "Countries"
            name: "list"
            widget: "list"
            fields:
              - {label: "Country Code", name: "code", widget: "string", hint: "ISO-style 2-letter code, e.g. NG"}
              - {label: "Country Name", name: "name", widget: "string"}
              - {label: "Currency Code", name: "currency", widget: "string"}
              - {label: "Currency Symbol", name: "symbol", widget: "string"}
              - {label: "Available in Calculator?", name: "available", widget: "boolean", default: true}
              - {label: "Flag", name: "flag", widget: "string", required: false}
              - {label: "URL Slug", name: "slug", widget: "string", required: false}
              - {label: "Default Language", name: "default_language", widget: "string", default: "en"}
              - {label: "Agricultural Data Source Profile", name: "source_profile", widget: "string", required: false, hint: "Automatic routing profile used to match this country to its configured government/market/agricultural data sources."}
              - {label: "Directory Only", name: "directory_only", widget: "boolean", default: false, required: false, hint: "Keep ON until country-specific regional, yield and price data is fully configured."}

  - name: "calculator_regions"
    label: "📍 Calculator: States, Regions & Provinces"
    files:
      - label: "Regional Coverage"
        name: "regions"
        file: "src/_data/calculator/regions.json"
        editor: {preview: false}
        fields:
          - label: "Countries & Regions"
            name: "regions"
            widget: "list"
            fields:
              - {label: "Country Code", name: "country_code", widget: "string"}
              - {label: "States / Regions / Provinces", name: "regions", widget: "list"}

  - name: "calculator_enterprises"
    label: "🌱 Calculator: Crops & Livestock"
    folder: "src/_data/calculator/commodities"
    create: true
    slug: "{{fields.id}}"
    identifier_field: name
    summary: "{{name}} — {{category}}"
    fields:
      - {label: "Enterprise ID", name: "id", widget: "string", hint: "Keep unique and URL-safe. Changing an existing ID can break links."}
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Active?", name: "active", widget: "boolean", default: true, hint: "Turn off to hide this enterprise without deleting its historical data."}
      - {label: "Category", name: "category", widget: "select", options: ["crop", "livestock"]}
      - {label: "Icon", name: "icon", widget: "string", required: false}
      - {label: "Calculator Unit Mode", name: "unit_mode", widget: "select", options: ["crop", "livestock_unit", "livestock_recurring"]}
      - {label: "Unit Label", name: "unit_label", widget: "string"}
      - {label: "Cycle (days)", name: "cycle_days", widget: "number", value_type: "int"}
      - {label: "Cycle Label", name: "cycle_label", widget: "string"}
      - {label: "Related eBook Slug", name: "related_ebook_slug", widget: "string", required: false}
      - label: "Enterprise Advice & Recommendations (Optional)"
        name: "advice"
        widget: "list"
        required: false
        fields:
          - {label: "Language Code", name: "language", widget: "string", default: "en", hint: "Use the language code from the Language Registry, e.g. en, fr, ar, pt, sw."}
          - {label: "Type", name: "type", widget: "select", options: ["tip", "info", "warning", "danger", "success"], default: "tip"}
          - {label: "Icon", name: "icon", widget: "string", required: false}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Body", name: "body", widget: "text"}
      - label: "Practical Recommendations (Optional)"
        name: "recommendations"
        widget: "list"
        required: false
        fields:
          - {label: "Language Code", name: "language", widget: "string", default: "en"}
          - {label: "Recommendation", name: "text", widget: "text"}
      - label: "Country Data & Prices"
        name: "country_data"
        widget: "list"
        fields:
          - {label: "Country Code", name: "country_code", widget: "string"}
          - {label: "Production Cost / Unit", name: "cost_per_unit", widget: "number", value_type: "float", required: false}
          - {label: "Cost Breakdown", name: "cost_breakdown", widget: "list", required: false, fields: [{label: "Label", name: "label", widget: "string"}, {label: "Amount", name: "amount", widget: "number", value_type: "float"}]}
          - {label: "Low Yield / Output", name: "yield_low", widget: "number", value_type: "float", required: false}
          - {label: "Expected Yield / Output", name: "yield_expected", widget: "number", value_type: "float", required: false}
          - {label: "High Yield / Output", name: "yield_high", widget: "number", value_type: "float", required: false}
          - {label: "Yield / Output Unit", name: "yield_unit", widget: "string", required: false}
          - {label: "Low Selling Price", name: "price_low", widget: "number", value_type: "float", required: false}
          - {label: "Expected Selling Price", name: "price_expected", widget: "number", value_type: "float", required: false}
          - {label: "High Selling Price", name: "price_high", widget: "number", value_type: "float", required: false}
          - {label: "Price Unit", name: "price_unit", widget: "string", required: false}
          - {label: "Seed Price", name: "seed_price", widget: "number", value_type: "float", required: false}
          - {label: "Seed Price Unit", name: "seed_price_unit", widget: "string", required: false}
          - {label: "Seed Variety / Brand", name: "seed_variety", widget: "string", required: false}
          - {label: "Source", name: "source", widget: "string", required: false}
          - {label: "Source URL", name: "source_url", widget: "string", required: false}
          - {label: "Data As Of", name: "as_of", widget: "string", required: false}
          - {label: "Data Status", name: "data_status", widget: "select", options: ["current", "stale", "needs_review", "manual_override"], default: "needs_review"}

  - name: "ag_data_sources"
    label: "🤖 Automatic Agricultural Data Sources"
    files:
      - label: "Source Registry & Automation Rules"
        name: "sources"
        file: "config/ag-data-sources.json"
        editor: {preview: false}
        fields:
          - {label: "Version", name: "version", widget: "number", value_type: "int"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Sources"
            name: "sources"
            widget: "list"
            fields:
              - {label: "Source ID", name: "id", widget: "string"}
              - {label: "Country Code / MULTI", name: "country", widget: "string"}
              - {label: "Region", name: "region", widget: "string", required: false}
              - {label: "Data Type", name: "data_type", widget: "select", options: ["commodity_price", "seed_price", "livestock_price", "input_price", "labour_price", "exchange_rate", "government_statistic"]}
              - {label: "Source Type", name: "source_type", widget: "select", options: ["government", "market", "relevant_agency", "research", "manual"]}
              - {label: "Publisher", name: "publisher", widget: "string"}
              - {label: "Source URL", name: "url", widget: "string", required: false}
              - {label: "Frequency", name: "frequency", widget: "string"}
              - {label: "Status", name: "status", widget: "string"}
              - {label: "Method", name: "method", widget: "string"}
              - {label: "Priority", name: "priority", widget: "number", value_type: "int", default: 50}
              - {label: "Auto Publish", name: "auto_publish", widget: "boolean", default: false, hint: "Keep OFF unless the source, units and geography are proven reliable."}
              - {label: "Requires Review", name: "requires_review", widget: "boolean", default: true}
              - {label: "Notes", name: "notes", widget: "text", required: false}

  - name: "agricultural_news"
    label: "📰 Agricultural News — 54 Countries"
    files:
      - label: "News Database & Verification"
        name: "news"
        file: "src/_data/agriculturalNews.json"
        editor: {preview: false}
        fields:
          - {label: "Version", name: "version", widget: "number", value_type: "int"}
          - {label: "Last Updated", name: "last_updated", widget: "string"}
          - {label: "Editorial Policy", name: "editorial_policy", widget: "text"}
          - label: "Countries"
            name: "countries"
            widget: "list"
            fields:
              - {label: "Country Code", name: "code", widget: "string"}
              - {label: "Country Name", name: "name", widget: "string"}
              - {label: "URL Slug", name: "slug", widget: "string"}
              - {label: "Flag", name: "flag", widget: "string", required: false}
              - label: "Articles"
                name: "articles"
                widget: "list"
                required: false
                fields:
                  - {label: "Category", name: "category", widget: "select", options: ["general", "crops", "livestock", "markets", "finance", "policy", "weather-climate", "machinery-technology", "research-innovation", "grants-programmes"]}
                  - {label: "Headline", name: "title", widget: "string"}
                  - {label: "Summary", name: "summary", widget: "text"}
                  - {label: "Original Source URL", name: "url", widget: "string"}
                  - {label: "Source / Publisher", name: "source", widget: "string"}
                  - {label: "Published Date", name: "published", widget: "string"}
                  - {label: "Verified Date", name: "verified", widget: "string"}
                  - {label: "Status", name: "status", widget: "select", options: ["official", "official-feed", "review", "expired", "archived"], default: "review"}
  - name: "agricultural_resources"
    label: "🌍 Agricultural Resources — 54 Countries"
    files:
      - label: "Finance, Grants, Machinery & General Resources"
        name: "resources"
        file: "src/_data/agriculturalResources.json"
        editor: {preview: false}
        fields:
          - {label: "Version", name: "version", widget: "number", value_type: "int"}
          - {label: "Last Updated", name: "last_updated", widget: "string"}
          - {label: "Verification Policy", name: "verification_policy", widget: "text"}
          - label: "Countries"
            name: "countries"
            widget: "list"
            fields:
              - {label: "Country Code", name: "code", widget: "string"}
              - {label: "Country Name", name: "name", widget: "string"}
              - {label: "URL Slug", name: "slug", widget: "string"}
              - {label: "Flag", name: "flag", widget: "string", required: false}
              - label: "Resource Records"
                name: "records"
                widget: "object"
                fields:
                  - label: "Finance"
                    name: "finance"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "Official Source URL", name: "url", widget: "string"}
                      - {label: "Provider", name: "source", widget: "string"}
                      - {label: "Verified Date", name: "verified", widget: "string"}
                      - {label: "Status", name: "status", widget: "select", options: ["official", "review", "expired", "archived"], default: "review"}
                  - label: "Grants & Opportunities"
                    name: "grants"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "Official Source URL", name: "url", widget: "string"}
                      - {label: "Provider", name: "source", widget: "string"}
                      - {label: "Verified Date", name: "verified", widget: "string"}
                      - {label: "Status", name: "status", widget: "select", options: ["official", "review", "expired", "archived"], default: "review"}
                  - label: "Machinery & Equipment"
                    name: "machinery"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "Official / Authoritative Source URL", name: "url", widget: "string"}
                      - {label: "Provider", name: "source", widget: "string"}
                      - {label: "Verified Date", name: "verified", widget: "string"}
                      - {label: "Status", name: "status", widget: "select", options: ["official", "review", "expired", "archived"], default: "review"}
                  - label: "General Agricultural Resources"
                    name: "general"
                    widget: "list"
                    required: false
                    fields:
                      - {label: "Title", name: "title", widget: "string"}
                      - {label: "Description", name: "description", widget: "text"}
                      - {label: "Official / Authoritative Source URL", name: "url", widget: "string"}
                      - {label: "Provider", name: "source", widget: "string"}
                      - {label: "Verified Date", name: "verified", widget: "string"}
                      - {label: "Status", name: "status", widget: "select", options: ["official", "review", "expired", "archived"], default: "official"}
  - name: "data_quality"
    label: "🛡️ Data Quality & Publishing Rules"
    files:
      - label: "Agricultural Data Policy"
        name: "policy"
        file: "config/ag-data-policy.json"
        editor: {preview: false}
        fields:
          - {label: "Default Requires Review", name: "default_requires_review", widget: "boolean", default: true}
          - {label: "Maximum Price Age (days)", name: "max_price_age_days", widget: "number", value_type: "int", default: 45}
          - {label: "Maximum Seed Price Age (days)", name: "max_seed_price_age_days", widget: "number", value_type: "int", default: 45}
          - {label: "Maximum FX Age (days)", name: "max_fx_age_days", widget: "number", value_type: "int", default: 3}
          - {label: "Allow Automatic Publishing", name: "allow_auto_publish", widget: "boolean", default: false}
          - {label: "Validation Notes", name: "validation_notes", widget: "text"}


  - name: "translation_automation"
    label: "🛡️ Translation Governance & Automation"
    files:
      - label: "Translation Automation Settings"
        name: "settings"
        file: "src/_data/translationSettings.json"
        editor: {preview: false}
        fields:
          - {label: "Enable Translation System", name: "enabled", widget: "boolean", default: true}
          - {label: "Source Language", name: "source_language", widget: "select", options: ["en"], default: "en"}
          - {label: "Target Languages", name: "target_languages", widget: "select", multiple: true, options: ["fr", "ar", "pt", "sw"], default: ["fr", "ar", "pt", "sw"]}
          - {label: "Automatic Generation", name: "automatic_generation", widget: "boolean", default: false, hint: "Keep OFF until a translation engine has passed quality testing. Draft generation must never publish automatically."}
          - {label: "Require Human Review", name: "require_review", widget: "boolean", default: true}
          - {label: "New Translation Status", name: "mark_new_translations", widget: "select", options: ["in_review", "translated"], default: "in_review"}
          - {label: "Automatically Update Existing Translations", name: "auto_update_existing_translations", widget: "boolean", default: false, hint: "Keep OFF to protect reviewed translations from automatic overwrite."}
          - {label: "Publish Machine Translations Automatically", name: "publish_machine_translations_automatically", widget: "boolean", default: false}
          - {label: "Preserve Reviewed Translations", name: "preserve_reviewed_translations", widget: "boolean", default: true}
          - {label: "Fallback to English", name: "fallback_to_source_language", widget: "boolean", default: true}
          - {label: "Review Queue", name: "review_queue", widget: "boolean", default: true}
          - {label: "Notes", name: "notes", widget: "text", required: false}

  - name: "content_governance"
    label: "🔐 CMS Content Governance & Safety"
    files:
      - label: "Publishing & Translation Safety Rules"
        name: "governance"
        file: "src/_data/cmsSettings.json"
        editor: {preview: false}
        fields:
          - label: "Content Governance"
            name: "content_governance"
            widget: "object"
            collapsed: false
            fields:
              - {label: "Source of Truth", name: "source_of_truth", widget: "select", options: ["en"], default: "en"}
