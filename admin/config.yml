              - {label: "Require Translation Review Before Publication", name: "require_translation_review_before_publication", widget: "boolean", default: true}
          - label: "Translation Controls"
            name: "translation_control"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Translation System Enabled", name: "enabled", widget: "boolean", default: true}
              - {label: "Automatic Generation", name: "automatic_generation", widget: "boolean", default: false}
              - {label: "Provider Mode", name: "provider_mode", widget: "string", default: "manual_or_approved_draft_engine"}
              - {label: "Auto-update Existing Translations", name: "auto_update_existing_translations", widget: "boolean", default: false}
              - {label: "Auto-publish Machine Translations", name: "publish_machine_translations_automatically", widget: "boolean", default: false}
              - {label: "Preserve Reviewed Translations", name: "preserve_reviewed_translations", widget: "boolean", default: true}
              - {label: "Fallback to Source Language", name: "fallback_to_source_language", widget: "boolean", default: true}
              - {label: "Review Queue Enabled", name: "review_queue", widget: "boolean", default: true}
              - {label: "Target Languages", name: "target_languages", widget: "list", default: ["fr", "ar", "pt", "sw"]}
          - label: "Sustainability & Audit"
            name: "cms_sustainability"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Translation Memory", name: "translation_memory", widget: "boolean", default: true}
              - {label: "Glossary Enabled", name: "glossary_enabled", widget: "boolean", default: true}
              - {label: "Per-language Glossary", name: "per_language_glossary", widget: "boolean", default: true}
              - {label: "Translation History", name: "translation_history", widget: "boolean", default: true}
              - {label: "Audit Log", name: "audit_log", widget: "boolean", default: true}
              - {label: "Rollback Supported", name: "rollback_supported", widget: "boolean", default: true}
              - {label: "Confirm Bulk Overwrite", name: "bulk_overwrite_requires_confirmation", widget: "boolean", default: true}
              - {label: "Confirm Published Translation Deletion", name: "delete_published_translation_requires_confirmation", widget: "boolean", default: true}
              - {label: "Configure New Languages", name: "new_language_requires_configuration", widget: "boolean", default: true}
          - label: "Publishing Safety"
            name: "publishing_safety"
            widget: "object"
            collapsed: true
            fields:
              - {label: "English Remains Publishable Without Translation", name: "english_remains_publishable_if_translation_is_missing", widget: "boolean", default: true}
              - {label: "Missing Translation Behavior", name: "missing_translation_behavior", widget: "select", options: ["fallback_to_english"], default: "fallback_to_english"}
              - {label: "Unreviewed Translation Behavior", name: "unreviewed_translation_behavior", widget: "select", options: ["hide_from_language_switcher_and_navigation"], default: "hide_from_language_switcher_and_navigation"}
              - {label: "Noindex Unreviewed Translations", name: "unreviewed_translation_indexing", widget: "boolean", default: false}
              - {label: "Failed Translation Must Not Block Build", name: "failed_translation_must_not_block_build", widget: "boolean", default: true}

