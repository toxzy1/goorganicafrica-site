name: GoOrganicAfrica Agricultural Data Monitor

on:
  schedule:
    - cron: '17 4 2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spreadsheet reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Monitor official agricultural data sources
        run: python scripts/update-ag-data.py

      - name: Create review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git status --porcelain | grep -q .; then exit 0; fi
          BRANCH="data-update-$(date -u +%Y-%m)"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add data/ag-data/pending
          git config user.name "GoOrganicAfrica Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): monitor agricultural sources"
          git push origin "$BRANCH"
          gh pr create --title "Agricultural data source update $(date -u +%Y-%m)" --body "Automated monitoring found new source data or source-status information. Review the official source, units, geography and period before merging. Seed prices are separately tracked because variety, brand, pack size, supplier and location can change independently." --base main --head "$BRANCH" || true
