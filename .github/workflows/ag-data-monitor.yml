name: Agricultural Data Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agricultural-data-monitor-review
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data parser
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Collect agricultural data candidates
        run: python scripts/update-ag-data.py

      - name: Run agricultural freshness monitor
        run: |
          npm ci
          npm run monitor:agriculture

      # Pending data is still a candidate, not approved production data.
      # Keep both the candidate files and monitor report in a draft PR.
      - name: Open or update review-only pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/agricultural-data-review
          delete-branch: true
          draft: true
          title: "Review agricultural data candidates"
          commit-message: "Prepare agricultural data candidates for human review"
          add-paths: |
            data/ag-data/pending
            reports/agricultural-data-monitor.json
          body: |
            ## Human review required

            This draft PR contains collected agricultural data candidates and a freshness/source-quality report.
            Nothing here is approved for calculator or website publication.

            Before accepting a candidate, verify the original source, country/region, commodity or input,
            unit, date, currency, methodology and whether the value is still current. Keep uncertain records
            pending and do not merge until a person has reviewed the evidence.
