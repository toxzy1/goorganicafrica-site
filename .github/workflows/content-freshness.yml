name: Content Freshness Audit

on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit news and resource coverage
        id: audit
        continue-on-error: true
        run: node scripts/check-content-freshness.js > freshness-report.json
      - name: Open or update review issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "The daily content audit found empty or stale country coverage."
          if ! gh issue list --state open --search "Content freshness audit in:title" --json number --jq 'length' | grep -q '^0$'; then
            exit 0
          fi
          gh issue create \
  --title "Content freshness audit — review required" \
  --body-file freshness-report.json
