name: Monitor agricultural directories

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check approved directory sources
        run: python scripts/update-directories.py
      - name: Store review queue as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: directory-review-queue
          path: data/directories/pending/
          if-no-files-found: ignore
