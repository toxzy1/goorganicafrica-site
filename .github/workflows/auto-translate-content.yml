name: Automatic Free Content Translation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/blog/posts/**"
      - "src/ebooks/**"
      - "scripts/auto-translate-content.py"
      - "src/_data/translationSettings.json"
      - ".github/workflows/auto-translate-content.yml"

concurrency:
  group: goorganicafrica-translation-drafts
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free offline translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate

      - name: Generate multilingual drafts
        run: |
          python -u scripts/auto-translate-content.py
          echo "Generated translation files:"
          find src/blog/posts src/ebooks -maxdepth 1 -type f \( -name '*-fr.md' -o -name '*-ar.md' -o -name '*-pt.md' -o -name '*-sw.md' \) -print
          count=$(find src/blog/posts src/ebooks -maxdepth 1 -type f \( -name '*-fr.md' -o -name '*-ar.md' -o -name '*-pt.md' -o -name '*-sw.md' \) | wc -l)
          echo "Translation file count: $count"
          test "$count" -eq 32
          echo "Verified 32 multilingual drafts (8 sources x 4 languages)."

      - name: Publish reviewed translation drafts to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- src/blog/posts src/ebooks)" ]; then
            echo "No translation files were generated."
            exit 0
          fi

          git config user.name "GoOrganicAfrica Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog/posts src/ebooks
          echo "Translation files ready for review:"
          git status --short -- src/blog/posts src/ebooks
          git commit -m "Draft multilingual content translations"
          git fetch origin main
          git rebase origin/main
          git push origin main
