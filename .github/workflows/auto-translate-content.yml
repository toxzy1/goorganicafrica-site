name: Automatic Free Content Translation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/blog/posts/**"
      - "src/ebooks/**"
      - "scripts/auto-translate-content.py"
      - "src/_data/translationSettings.json"
      - ".github/workflows/auto-translate-content.yml"

concurrency:
  group: goorganicafrica-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore translation cache
        id: translation-cache
        uses: actions/cache/restore@v5
        with:
          path: .translation-cache.json
          key: goa-translation-cache-v9-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            goa-translation-cache-v9-${{ github.ref_name }}-

      - name: Restore Argos language-model cache
        id: argos-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: goa-argos-models-v1-${{ runner.os }}-en-fr-ar-pt-sw

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free offline Argos translation engine
        env:
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_COMPUTE_TYPE: int8_float32
          ARGOS_BATCH_SIZE: "32"
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate
          argospm update
          argospm install translate-en_fr
          argospm install translate-en_ar
          argospm install translate-en_pt
          argospm install translate-en_sw
          argospm list

      - name: Generate multilingual drafts
        timeout-minutes: 180
        run: |
          python -u scripts/auto-translate-content.py
          echo "Multilingual draft files currently present:"
          find src/blog/posts src/ebooks -maxdepth 1 -type f -name '*.md' | sort
          echo "Configured target languages:"
          python - <<'PY'
          import json
          cfg = json.load(open("src/_data/translationSettings.json", encoding="utf-8"))
          print(", ".join(cfg.get("target_languages", [])))
          PY
          echo "Universal translation quality checks completed by the generator."

      - name: Publish reviewed translation drafts to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- src/blog/posts src/ebooks)" ]; then
            echo "No translation files were generated."
            exit 0
          fi

          git config user.name "GoOrganicAfrica Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog/posts src/ebooks
          echo "Translation files ready for review:"
          git status --short -- src/blog/posts src/ebooks
          git commit -m "Draft multilingual content translations"
          git fetch origin main
          git rebase origin/main
          git push origin main

      - name: Save translation cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .translation-cache.json
          key: goa-translation-cache-v9-${{ github.ref_name }}-${{ github.run_id }}
