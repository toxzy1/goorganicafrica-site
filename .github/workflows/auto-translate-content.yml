name: Automatic Free Content Translation Drafts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/blog/posts/**"
      - "src/ebooks/**"
      - "scripts/auto-translate-content.py"
      - "src/_data/translationSettings.json"
      - ".github/workflows/auto-translate-content.yml"

concurrency:
  group: goorganicafrica-translation-drafts
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free offline translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate

      - name: Generate multilingual drafts
        run: python scripts/auto-translate-content.py

      - name: Create translation pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/blog/posts src/ebooks; then
            echo "No translation files were generated."
            exit 0
          fi

          BRANCH="auto/translations-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "GoOrganicAfrica Translation Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog/posts src/ebooks
          git commit -m "Draft multilingual content translations"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" --title "Draft multilingual Blog/eBook translations" --body "Generated locally with the open-source Argos Translate engine. No commercial translation API or API key is used. Review every language before merging. English remains the source of truth."
