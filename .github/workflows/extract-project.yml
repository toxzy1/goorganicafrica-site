name: Extract GoOrganicAfrica project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FINAL REBUILT project
        run: |
          set -e

          ZIP_FILE="./GoOrganicAfrica-LOCALIZATION-FIX (1) (1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf .extract
          mkdir .extract

          unzip -q "$ZIP_FILE" -d .extract

          if [ ! -f ".extract/package.json" ]; then
            echo "ERROR: package.json was not found at ZIP root."
            exit 1
          fi

          echo "Fixing siteTranslations.json..."

          python3 - <<'PY'
          import json

          path = ".extract/src/_data/siteTranslations.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data.get("languages"), dict) and isinstance(data["languages"].get("languages"), list):
              data["languages"] = data["languages"]["languages"]

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("siteTranslations.json corrected.")
          PY

          cp -a .extract/.eleventy.js .
          cp -a .extract/admin .
          cp -a .extract/config .
          cp -a .extract/scripts .
          cp -a .extract/src .
          cp -a .extract/.gitignore .
          cp -a .extract/package.json .

          if [ -d ".extract/data" ]; then
            cp -a .extract/data .
          fi

          cp -a .extract/README.md . 2>/dev/null || true
          cp -a .extract/*.md . 2>/dev/null || true
          cp -a .extract/netlify.toml . 2>/dev/null || true

          rm -rf .extract
          rm -f "$ZIP_FILE"

      - name: Verify FINAL REBUILT files
        run: |
          set -e

          test -f package.json
          test -f src/_data/calculatorCountries.json
          test -f src/_data/categories.json
          test -f src/_data/siteTranslations.json
          test -f src/js/calculator-app.js
          test -f admin/config.yml

          python3 - <<'PY'
          import json

          with open("src/_data/siteTranslations.json", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data.get("languages"), list)
          print("Translation language structure verified.")
          PY

          echo "FINAL REBUILT files verified successfully."

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install FINAL REBUILT GoOrganicAfrica project" || echo "Nothing to commit"
          git push
