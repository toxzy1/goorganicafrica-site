name: Extract GoOrganicAfrica project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract automation package
        run: |
          rm -rf .extract
          mkdir .extract

          unzip -q "GoOrganicAfrica-AUTOMATION-FINAL (1).zip" -d .extract

          cp -a .extract/. .

          rm -rf .extract
          rm -f "GoOrganicAfrica-AUTOMATION-FINAL (1).zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Extract GoOrganicAfrica automation project" || echo "Nothing to commit"

          git push
