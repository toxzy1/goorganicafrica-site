name: Extract GoOrganicAfrica project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf .extract
          mkdir .extract

          unzip -q "$ZIP_FILE" -d .extract

          echo "Extracted contents:"
          find .extract -maxdepth 2 -type f | head -50

          cp -a .extract/. .

          rm -rf .extract
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Extract GoOrganicAfrica project" || echo "Nothing to commit"

          git push
