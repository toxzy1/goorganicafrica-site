name: Extract GoOrganicAfrica project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: - name: Extract FINAL REBUILT project
        run: |
          set -e

          ZIP_FILE="./GoOrganicAfrica-FINAL-REBUILT (2).zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: GoOrganicAfrica-MULTILINGUAL-CMS-FINAL.zip was not found in repository root."
            echo "Make sure the exact ZIP file is uploaded to the repository root."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf .extract
          mkdir .extract

          unzip -q "$ZIP_FILE" -d .extract

          if [ ! -f ".extract/package.json" ]; then
            echo "ERROR: package.json was not found at ZIP root."
            exit 1
          fi

          cp -a .extract/.eleventy.js .
          cp -a .extract/admin .
          cp -a .extract/config .
          cp -a .extract/data .
          cp -a .extract/scripts .
          cp -a .extract/src .
          cp -a .extract/.gitignore .
          cp -a .extract/package.json .
          cp -a .extract/README.md . 2>/dev/null || true
          cp -a .extract/*.md . 2>/dev/null || true
          cp -a .extract/netlify.toml . 2>/dev/null || true

          rm -rf .extract
          rm -f "$ZIP_FILE"

      - name: Verify multilingual CMS files
        run: |
          set -e

          test -f src/_data/siteTranslations.js
          test -f src/_data/siteTranslations.json
          test -f src/js/language-switcher.js
          test -f src/js/calculator-app.js
          test -f src/js/calculator-advice.js
          test -f admin/config.yml

          echo "Multilingual CMS files verified successfully."

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install multilingual CMS update" || echo "Nothing to commit"
          git push
