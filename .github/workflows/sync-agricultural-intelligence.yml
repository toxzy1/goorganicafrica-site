name: Sync agricultural intelligence

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agricultural-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync news and opportunities
        run: npm run sync:agriculture

      - name: Monitor freshness and review queues
        run: npm run monitor:agriculture

      - name: Check generated data
        run: |
          npm run check:cms
          npm run check:i18n
          npm run audit:resources

      # Automated discoveries must never commit straight to main. They stay in
      # a draft PR until a person checks sources, relevance, dates and eligibility.
      - name: Open or update review-only pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/agricultural-intelligence-review
          delete-branch: true
          draft: true
          title: "Review agricultural intelligence updates"
          commit-message: "Prepare agricultural intelligence candidates for review"
          add-paths: |
            src/_data/agriculturalNews.json
            src/_data/agriculturalResources.json
            src/_data/agriculturalOpportunities.json
            reports/agricultural-data-monitor.json
          body: |
            ## Human review required

            This draft PR contains automatically discovered agricultural news and opportunity candidates.
            **Do not publish by merging until a reviewer has checked each item.**

            Please verify:
            - The link opens the original, relevant source.
            - The country assignment and category are correct.
            - Publication date, deadline, eligibility and amounts are accurate where applicable.
            - The item is not expired, duplicated, or merely a generic landing page.
            - The record remains marked for review until accepted.

            Automated discovery is not fact-checking. Keep uncertain or unsupported candidates out of published content.
