name: Agricultural News Update — Review Queue

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync authoritative agricultural news
        run: node scripts/sync-agricultural-news.js

      - name: Create review PR when new news is found
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update agricultural news candidates"
          title: "📰 Agricultural news candidates — review required"
          draft: true
          delete-branch: true
          body: |
            Automated candidate update from configured authoritative agricultural sources.

            Review every item before merging:
            - confirm the original source URL
            - confirm country assignment
            - confirm publication date
            - confirm category
            - remove expired, duplicate or irrelevant items

            Nothing is published to the main site until this PR is reviewed and merged.
          branch: automation/agricultural-news
          delete-branch: false
