name: Build and Validate Site
# End-to-end build validation for every main deployment.
# Preserve the original agricultural resources release baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cms/review-first-agriculture-sync]

# New commits supersede older preview checks; cancel stale runs so the
# browser smoke job does not wait for a preview SHA that has already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate agricultural source-quality monitor
        run: npm run monitor:agriculture

      - name: Build site
        run: npm run build

      - name: Run site architecture checks
        run: npm run check

      - name: Validate UI localization keys and translated content artifacts
        run: npm run check:i18n

      - name: Audit rendered pages for duplicate and mixed-language content
        run: npm run audit:rendered

  browser-smoke:
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'qa/decision-centre-search-fallbacks' || github.event.pull_request.head.ref == 'cms/review-first-agriculture-sync' || github.event.pull_request.head.ref == 'fix/mobile-navigation-scroll' || github.event.pull_request.head.ref == 'fix/homepage-language-coverage' || github.event.pull_request.head.ref == 'fix/markets-commodity-localization' || github.event.pull_request.head.ref == 'fix/markets-date-and-label-localization' || github.event.pull_request.head.ref == 'fix/markets-copy-localization' || github.event.pull_request.head.ref == 'fix/markets-date-localization' || github.event.pull_request.head.ref == 'fix/markets-date-label-localization' || github.event.pull_request.head.ref == 'fix/markets-card-date-labels' || github.event.pull_request.head.ref == 'fix/markets-period-localization')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOA_PREVIEW_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site and browser-test dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Build site for local browser smoke tests
        run: npm run build

      - name: Start local site for real-browser tests
        run: |
          (npx eleventy --serve --port=8080 > /tmp/goa-eleventy.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/markets/ > /dev/null; then
              echo "Local Eleventy server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/goa-eleventy.log
          echo "::error::Local Eleventy server did not become ready."
          exit 1

      - name: Run real-browser visitor smoke tests
        run: npx playwright test
