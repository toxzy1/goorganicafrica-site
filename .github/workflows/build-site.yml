name: Build and Validate Site
# End-to-end build validation for every main deployment.
# Preserve the original agricultural resources release baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Python for translation safety tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test translation draft safety and batch limits
        run: python -m unittest discover -s tests -p "test_translate_agricultural_news.py"

      - name: Build site
        run: npm run build

      - name: Run site architecture checks
        run: npm run check

      - name: Audit rendered pages for duplicate and mixed-language content
        run: npm run audit:rendered
