name: Build and Validate Site
# End-to-end build validation for every main deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Run site architecture checks
        run: npm run check

      - name: Audit rendered pages for duplicate and mixed-language content
        run: npm run audit:rendered

      - name: Install Chromium for calculator browser tests
        run: npx playwright install --with-deps chromium

      - name: Test calculator language switching
        run: npx playwright test
