name: Build and Validate Site
# Integrated validation for site build, agricultural data and review-first automation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python for automation tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Check agricultural automation scripts
        run: |
          node --check scripts/sync-agricultural-opportunities.js
          node scripts/sync-agricultural-opportunities.js --self-test

      - name: Run free translation automation unit tests
        run: python -m unittest discover -s tests -p "test_translate_agricultural_news.py"

      - name: Build site
        run: npm run build

      - name: Audit agricultural data coverage and integrity
        run: npm run audit:agriculture

      - name: Run site architecture checks
        run: npm run check

      - name: Audit rendered pages for duplicate and mixed-language content
        run: npm run audit:rendered
