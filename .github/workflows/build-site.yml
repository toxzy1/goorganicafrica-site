name: Build and Validate Site
# End-to-end build validation for every main deployment.
# Preserve the original agricultural resources release baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cms/review-first-agriculture-sync]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate agricultural source-quality monitor
        run: npm run monitor:agriculture

      - name: Build site
        run: npm run build

      - name: Run site architecture checks
        run: npm run check

      - name: Validate UI localization keys and translated content artifacts
        run: npm run check:i18n

      - name: Audit rendered pages for duplicate and mixed-language content
        run: npm run audit:rendered

  browser-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'qa/decision-centre-search-fallbacks'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOA_PREVIEW_URL: https://qa-decision-centre-search-fa.goorganicafrica-site.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install site and browser-test dependencies
        run: |
          npm install
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Wait for the branch preview to respond
        run: |
          for attempt in $(seq 1 36); do
            if curl --connect-timeout 5 --max-time 15 --fail --silent --show-error "$GOA_PREVIEW_URL/" -o /dev/null; then
              echo "Preview is responding."
              sleep 60
              exit 0
            fi
            echo "Preview not ready (attempt $attempt/36); retrying in 10 seconds."
            sleep 10
          done
          echo "Preview did not become reachable."
          exit 1

      - name: Run real-browser visitor smoke tests
        run: npx playwright test
